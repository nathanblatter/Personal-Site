name: portfolio

services:
  api:
    image: backend-api:latest
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/portfolio
      DATABASE_URL_KPI: postgresql://postgres:postgres@host.docker.internal:5432/kpi
      DATABASE_URL_JOURNAL: postgresql://postgres:postgres@host.docker.internal:5432/journal
      STATIC_DIR: /dist
      SMTP_HOST: docker-services-postfix-1
      SMTP_PORT: 25
      CONTACT_TO_EMAIL: nzb22@byu.edu
      REDIS_URL: redis://host.docker.internal:6379
      MINIO_ENDPOINT: docker-services-minio-1:9000
      MINIO_BUCKET: portfolio
      TZ: America/Denver
      CLAUDE_DATA_DIRS: /claude_data_mini,/claude_data_laptop
    volumes:
      - /Users/nathanblatter/.claude/projects:/claude_data_mini:ro
      - /Users/nathanblatter/.claude-laptop/projects:/claude_data_laptop:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/status/healthz')"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - portfolio
      - docker-services

  journal-worker:
    image: backend-worker:latest
    env_file: .env.prod
    environment:
      DATABASE_URL_JOURNAL: postgresql://postgres:postgres@host.docker.internal:5432/journal
      REDIS_URL: redis://host.docker.internal:6379
      MINIO_ENDPOINT: docker-services-minio-1:9000
      MINIO_BUCKET: portfolio
      WEAVE_PROVIDER: claude
      TZ: America/Denver
      HF_HOME: /models
    volumes:
      - whisper_models:/models
    restart: unless-stopped
    # Whisper large-v3 on CPU can starve the whole machine without these caps
    # (took down every tunnel + Postgres connections on 2026-07-06).
    cpus: 4
    mem_limit: 6g
    networks:
      - portfolio
      - docker-services

  tunnel:
    image: cloudflare/cloudflared:latest
    env_file: .env.prod
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - portfolio

  # Tiny reverse-proxy exposing the api's health check on the mini's Tailscale
  # IP so the iMac failover watcher can probe THIS origin directly (not via the
  # public CNAME, which points at the iMac during failover). Proxies by service
  # name, so it survives the api's zero-downtime rescale. Not scaled → no port
  # clash with the api replicas.
  health-probe:
    image: caddy:2-alpine
    container_name: portfolio-health-probe
    command: caddy reverse-proxy --from :8891 --to api:8000
    restart: unless-stopped
    ports:
      - "100.79.61.79:8891:8891"
    depends_on:
      - api
    networks:
      - portfolio

volumes:
  whisper_models:

networks:
  portfolio:
  docker-services:
    external: true
    name: docker-services_default
