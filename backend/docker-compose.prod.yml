name: portfolio

services:
  api:
    image: backend-api:latest
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/portfolio
      DATABASE_URL_KPI: postgresql://postgres:postgres@host.docker.internal:5432/kpi
      STATIC_DIR: /dist
      SMTP_HOST: docker-services-postfix-1
      SMTP_PORT: 25
      CONTACT_TO_EMAIL: nzb22@byu.edu
      REDIS_URL: redis://host.docker.internal:6379
      MINIO_ENDPOINT: docker-services-minio-1:9000
      MINIO_BUCKET: portfolio
      TZ: America/Denver
      CLAUDE_DATA_DIRS: /claude_data_mini,/claude_data_laptop
    volumes:
      - /Users/nathanblatter/.claude/projects:/claude_data_mini:ro
      - /Users/nathanblatter/.claude-laptop/projects:/claude_data_laptop:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - portfolio
      - docker-services

  tunnel:
    image: cloudflare/cloudflared:latest
    env_file: .env.prod
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - portfolio

networks:
  portfolio:
  docker-services:
    external: true
    name: docker-services_default
