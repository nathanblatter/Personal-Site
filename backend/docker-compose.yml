services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://portfolio:portfolio@db:5432/portfolio
      DATABASE_URL_JOURNAL: postgresql://portfolio:portfolio@db:5432/journal
      JOURNAL_LINK_SECRET: change-me-dev-journal
      STATIC_DIR: /dist
      JWT_SECRET: change-me-dev
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      SMTP_HOST: host.docker.internal
      SMTP_PORT: 25
      CONTACT_TO_EMAIL: nzb22@byu.edu
      REDIS_URL: redis://host.docker.internal:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: portfolio
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ../frontend/dist:/dist:ro

  journal-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
    environment:
      DATABASE_URL_JOURNAL: postgresql://portfolio:portfolio@db:5432/journal
      REDIS_URL: redis://host.docker.internal:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: portfolio
      WEAVE_PROVIDER: claude
      # ANTHROPIC_API_KEY passed through from the host shell for the weave pass.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - whisper_models:/models

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

volumes:
  pgdata:
  minio_data:
  whisper_models:
