name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # A stalled docker step once hung for GitHub's 6h default (2026-09-19); a full
    # build + rollout takes ~10 min, so anything past this is a wedge, not progress.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend gates (lint + typecheck + build)
        run: |
          cd frontend && npm ci
          npm run lint
          npm run build   # tsc -b && vite build

      - name: Deploy
        run: |
          # Secrets live OUTSIDE iCloud Drive. ~/Desktop is iCloud-synced and file
          # opens from the launchd-spawned runner block forever / EDEADLK there
          # (2026-08-29 "resource deadlock avoided", 2026-09-19 6h hang in
          # compose's env_file open). Only .env.prod is resolved from here.
          PROD=/Users/nathanblatter/deploy/Personal-Site
          COMPOSE=$GITHUB_WORKSPACE/backend/docker-compose.prod.yml
          COMPOSE_ARGS="--project-directory $PROD/backend -f $COMPOSE"

          # Build image — frontend pre-built, single-stage Python image
          cd $GITHUB_WORKSPACE
          DOCKER_BUILDKIT=0 docker build --pull=false -f backend/Dockerfile -t backend-api:latest .
          # Journal transcription/weave worker image (separate: faster-whisper is heavy)
          DOCKER_BUILDKIT=0 docker build --pull=false -f backend/Dockerfile.worker -t backend-worker:latest .

          # Smoke-check the images before touching prod: a partial commit
          # (module imported but its file never git-added) otherwise only
          # surfaces as an unhealthy container mid-rollout (2026-08-01 incident).
          docker run --rm backend-api:latest python -c "import app.main"
          docker run --rm backend-worker:latest python -c "import app.journal_worker"

          # Backend test gate, run inside the image we're about to ship so deps match prod.
          docker run --rm -v "$GITHUB_WORKSPACE/backend:/src:ro" -w /src backend-api:latest \
            sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q tests"

          # Get current running container ID
          cd $GITHUB_WORKSPACE/backend
          OLD_CONTAINER=$(docker compose $COMPOSE_ARGS ps -q api 2>/dev/null | head -1)

          # (Re)start the journal worker with the freshly built image, out of band
          # from the api's zero-downtime dance.
          docker compose $COMPOSE_ARGS up -d journal-worker

          if [ -z "$OLD_CONTAINER" ]; then
            echo "No existing container, starting fresh..."
            docker compose $COMPOSE_ARGS up -d
            sleep 10
            docker compose $COMPOSE_ARGS exec api python seed.py
            exit 0
          fi

          # Scale up: start new container alongside old
          echo "Scaling up to 2 replicas..."
          docker compose $COMPOSE_ARGS up -d --scale api=2 --no-recreate

          # Identify new container
          NEW_CONTAINER=$(docker compose $COMPOSE_ARGS ps -q api | grep -v "^${OLD_CONTAINER}$" | head -1)
          if [ -z "$NEW_CONTAINER" ]; then
            echo "ERROR: Could not identify new container"
            exit 1
          fi
          echo "Old: $OLD_CONTAINER | New: $NEW_CONTAINER"

          # Wait for health check to pass
          echo "Waiting for new container to be healthy..."
          HEALTHY=false
          for i in $(seq 1 40); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_CONTAINER" 2>/dev/null)
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              echo "New container is healthy!"
              break
            elif [ "$STATUS" = "unhealthy" ]; then
              echo "ERROR: New container is unhealthy, rolling back..."
              docker stop "$NEW_CONTAINER" && docker rm "$NEW_CONTAINER"
              exit 1
            else
              echo "  Status: ${STATUS:-starting} ($i/40)..."
              sleep 5
            fi
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Health check timed out, rolling back..."
            docker stop "$NEW_CONTAINER" && docker rm "$NEW_CONTAINER"
            exit 1
          fi

          # Stop old container
          echo "Removing old container..."
          docker stop "$OLD_CONTAINER" && docker rm "$OLD_CONTAINER"

          # Run seed on new container
          docker exec "$NEW_CONTAINER" python seed.py

          echo "Zero-downtime deploy complete!"
