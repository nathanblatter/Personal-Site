name: Weekly Booking Availability Link

# Every Monday, mint a magic link to the token-gated quick-update form
# (purpose=availability) and text it to Nathan over iMessage, so he can set his
# booking availability for the week without logging in. The generate endpoint
# sends the iMessage itself (send=true), so this is a single curl.
# Failure-tolerant: a non-2xx just logs; next week self-heals.

on:
  schedule:
    - cron: '0 15 * * 1'   # 15:00 UTC every Monday
  workflow_dispatch:

jobs:
  send-link:
    runs-on: self-hosted
    steps:
      - name: Generate + text availability link
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          SITE_URL="${SITE_URL:-https://nathanblatter.com}"
          echo "Requesting weekly availability link at ${SITE_URL}/api/v1/quick-update/generate"
          curl -fsS -m 30 -X POST "${SITE_URL%/}/api/v1/quick-update/generate" \
            -H "X-Quick-Update-Token: ${{ secrets.QUICK_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purpose":"availability","send":true}' \
            && echo "Sent." \
            || echo "Generate call failed (non-fatal); will retry next week."
